// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.gradleToolsVersion = '9.0.1'

    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:${gradleToolsVersion}"
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

ext {
    apkNamePrefix = 'DataStats'
    versionName = "2.8.7"
    versionCode = 34

    compileSdkVersion = 36
    buildToolsVersion = '36.0.0'

    targetSdkVersion = 35
    minSdkVersion = 23
}